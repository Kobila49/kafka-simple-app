server:
  port: 9001

topic:
  name: cars
  partitions: 3

spring:
  application:
    name: kafka-simple-app
  jackson:
    serialization:
      indent-output: true

  # On bootRun, Spring Boot's Docker Compose support replaces these with the container's details.
  datasource:
    url: jdbc:postgresql://localhost:5432/cars
    username: cars
    password: cars
    hikari:
      # 3 s instead of 30 s, so the "database down" retry demo doesn't take minutes.
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Spring Boot builds the KafkaTemplate and the listener container factory from these settings.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Plain JSON, without a __TypeId__ header naming the Java class.
        "[spring.json.add.type.headers]": false
    listener:
      # Consumer threads per app instance. Each one is a member of the consumer group.
      concurrency: 1
    consumer:
      group-id: car-db-writer
      # Where a group without committed offsets starts: at the beginning (Kafka's default is latest).
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Turns invalid JSON into an error for the error handler, instead of failing on every poll.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Without type headers, the consumer decides what type the JSON is read into.
        "[spring.json.value.default.type]": com.example.kafka_simple_app.dto.CarDTO
