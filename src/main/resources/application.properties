spring.application.name=kafka-simple-app
server.port=9001
spring.jackson.serialization.indent-output=true

# PostgreSQL from compose.yaml. When started with bootRun, Spring Boot's Docker Compose
# support supplies the connection details from the running container instead.
spring.datasource.url=jdbc:postgresql://localhost:5432/cars
spring.datasource.username=cars
spring.datasource.password=cars
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka from compose.yaml
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.group-id=group_id
topic.name=topic.igor
