# Local infrastructure for the app. `./gradlew bootRun` starts it automatically
# (Spring Boot Docker Compose support), or run `docker compose up -d` yourself.
#
# To run the app in Docker too, enable the "app" profile:
#   docker compose --profile app up -d --build
services:

  # The app itself, built from the Dockerfile. It's in the "app" profile, so plain
  # `docker compose up` and `./gradlew bootRun` (which runs the app on your machine) skip it.
  app:
    profiles: [app]
    build: .
    image: kafka-simple-app
    ports:
      # A range, so `--scale app=3` can give each instance its own host port (9001, 9002, 9003).
      - "9001-9003:9001"
    environment:
      # Inside the compose network, the other services are reached by name. Kafka advertises
      # kafka:19092 (its PLAINTEXT listener) for clients in other containers.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cars
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Single-node Kafka in KRaft mode (no ZooKeeper): one process is both broker and controller.
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: PLAINTEXT for containers on the compose network (Kafka UI),
      # PLAINTEXT_HOST for the Spring app running on your machine.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Internal topics default to replication factor 3, which a single broker can't satisfy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics have to be declared (the app does it with a NewTopic bean), so a typo in a
      # topic name fails loudly instead of silently creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 20

  # Web UI for browsing topics, partitions, messages and consumer groups: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      # Not a dependency of the app, so Spring Boot shouldn't wait for it or try to connect to it.
      org.springframework.boot.ignore: true

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cars
      POSTGRES_USER: cars
      POSTGRES_PASSWORD: cars
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U cars -d cars
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
