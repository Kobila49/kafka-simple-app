# Local infrastructure for the app. `./gradlew bootRun` starts it automatically
# (Spring Boot Docker Compose support), or run `docker compose up -d` yourself.
services:

  # Single-node Kafka in KRaft mode (no ZooKeeper): one process is both broker and controller.
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: PLAINTEXT for containers on the compose network (Kafka UI),
      # PLAINTEXT_HOST for the Spring app running on your machine.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Internal topics default to replication factor 3, which a single broker can't satisfy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The app's topic is created on first use.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 20

  # Web UI for browsing topics, partitions, messages and consumer groups: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      # Not a dependency of the app, so Spring Boot shouldn't wait for it or try to connect to it.
      org.springframework.boot.ignore: true

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cars
      POSTGRES_USER: cars
      POSTGRES_PASSWORD: cars
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U cars -d cars
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
